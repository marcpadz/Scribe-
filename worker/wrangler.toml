name = "scribe-auth-worker"
main = "src/index.ts"
compatibility_date = "2026-02-07"
compatibility_flags = ["nodejs_compat"]

# D1 database for users / sessions / verification
[[d1_databases]]
binding = "DB"
database_name = "scribe-auth-db"
database_id = "c6d970d2-6d06-433f-84fe-95151814d153"

[vars]
BETTER_AUTH_URL = "https://scribe-auth-worker.marcpadz.workers.dev"
APP_NAME = "NeoScriber"
# Cobalt API — leave empty to use the default instance; set to self-hosted for production
# COBALT_API_URL = "https://api.cobalt.tools"

# Secrets (NEVER commit): npx wrangler secret put GEMINI_API_KEY / RESEND_API_KEY / BETTER_AUTH_SECRET / COBALT_API_KEY
